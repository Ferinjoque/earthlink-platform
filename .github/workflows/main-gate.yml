name: Gate · main

# Corre solo cuando se propone o hace push a main.
# No se ejecuta en develop ni otras ramas — los devs corren `npm run ci` localmente.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'lh-*.json'
      - 'lighthouse-*.json'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'lh-*.json'
      - 'lighthouse-*.json'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # Variables de entorno mínimas para que el build de Next.js no falle.
      # No apuntan a Supabase real — solo satisfacen la validación de formato en tiempo de build.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npm run build
